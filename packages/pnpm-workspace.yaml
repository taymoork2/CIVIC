# One engine workspace and lockfile; demo apps keep separate installs.
packages:
  - '*'
  - '../graph'
  - '../review'
  - '../importers'
  - '../crawl'
catalog:
  typescript: ^7.0.2
  '@types/node': ^26.6.6
  playwright-core: ^1.65.1
  react: ^19.3.1
  '@types/react': ^19.3.0
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: ^1.6.0
peerDependencyRules:
  # Vite+ keeps Vite's API but reports its own version.
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
overrides:
  vite@*: "catalog:"
allowBuilds:
  esbuild: true
  '@parcel/watcher': false
minimumReleaseAgeExclude:
  - xstate@6.0.0-beta.3
  - '@xstate/effect@1.0.0-beta.2'
