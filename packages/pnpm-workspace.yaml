# CIVIC's engine packages (decision 0010): the canvas, the shell and the Vite connector, with
# the canvas examples. The workspace sits here rather than at the repository root so CIVIC's
# other projects (graph, importers, review, crawl, demos) keep their own installs.
packages:
  - '*'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: ^1.6.0
peerDependencyRules:
  # Vite+ keeps Vite's API but reports its own version.
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
overrides:
  vite@*: "catalog:"
allowBuilds:
  esbuild: true
  '@parcel/watcher': false
