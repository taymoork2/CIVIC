name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rehearsal:
    name: Rehearsal checks and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rehearsal/source
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 26.10.0
          cache: pnpm
          cache-dependency-path: rehearsal/source/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Types and style checks across the shell, Laundry adapter, planner and Convex.
      - run: pnpm run check
      - run: pnpm test
      # The review inventory needs a Git HEAD; the checkout provides it.
      - run: pnpm --dir apps/web run test:review
