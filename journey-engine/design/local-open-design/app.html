<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rehearsal · Operate — Laundry App</title>
<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio.
   Put this @layer first; product CSS outside the layer always wins. */
@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap  { white-space: nowrap; }
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }
  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
/* /OD-LAYOUT-PRIMITIVES v1 */

/* ───────── Rehearsal tokens (workbench only — never inside the reviewed preview) ───────── */
:root{
  color-scheme: light;
  --bg:#F4F5F6; --surface:#FFFFFF; --surface-2:#EFF1F3; --stage:#E6E8EB;
  --ink:#15171A; --ink-2:#2B2F35; --muted:#5A6068; --line:#DCDFE3; --line-strong:#C2C7CD;
  --spike:#C23A14; --spike-ink:#FFFFFF; --spike-soft:#FBE9E3;
  --ok:#1C6E46; --ok-soft:#E3F2EA; --warn:#7F5300; --warn-soft:#FBF0D9; --err:#B3261E; --err-soft:#FBE7E6;
  --focus:#1F57C3;
  --shadow-preview: 0 1px 2px rgba(16,18,22,.08), 0 12px 32px rgba(16,18,22,.10);
  --shadow-pop: 0 2px 6px rgba(16,18,22,.08), 0 16px 40px rgba(16,18,22,.14);

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --t-xs:12px; --t-sm:13px; --t-md:15px; --t-read:16px; --t-lg:17px; --t-xl:22px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --r1:6px; --r2:10px; --r3:12px;
  --dur-1:150ms; --dur-2:200ms; --dur-3:220ms;
  --ease-out:cubic-bezier(.2,.8,.2,1); --ease-in:cubic-bezier(.4,0,1,1);
  --top-h:52px; --rail-w:264px; --insp-w:368px;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0F1113; --surface:#171A1E; --surface-2:#1F2328; --stage:#0B0D0F;
  --ink:#ECEEF0; --ink-2:#D3D7DC; --muted:#A0A6AE; --line:#2A2F35; --line-strong:#3A4048;
  --spike:#FF7A52; --spike-ink:#1A0A04; --spike-soft:#3A1B10;
  --ok:#5CC98F; --ok-soft:#12291D; --warn:#E6B44C; --warn-soft:#2E230C; --err:#FF8A80; --err-soft:#33130F;
  --focus:#7FA8FF;
  --shadow-preview: 0 0 0 1px rgba(255,255,255,.06), 0 16px 40px rgba(0,0,0,.5);
  --shadow-pop: 0 0 0 1px rgba(255,255,255,.08), 0 20px 48px rgba(0,0,0,.55);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    color-scheme: dark;
    --bg:#0F1113; --surface:#171A1E; --surface-2:#1F2328; --stage:#0B0D0F;
    --ink:#ECEEF0; --ink-2:#D3D7DC; --muted:#A0A6AE; --line:#2A2F35; --line-strong:#3A4048;
    --spike:#FF7A52; --spike-ink:#1A0A04; --spike-soft:#3A1B10;
    --ok:#5CC98F; --ok-soft:#12291D; --warn:#E6B44C; --warn-soft:#2E230C; --err:#FF8A80; --err-soft:#33130F;
    --focus:#7FA8FF;
    --shadow-preview: 0 0 0 1px rgba(255,255,255,.06), 0 16px 40px rgba(0,0,0,.5);
    --shadow-pop: 0 0 0 1px rgba(255,255,255,.08), 0 20px 48px rgba(0,0,0,.55);
  }
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font:400 var(--t-md)/1.45 var(--font); color:var(--ink); background:var(--bg);
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  display:grid; overflow:hidden;
  grid-template-columns: var(--rail-w) minmax(0,1fr) var(--insp-w);
  grid-template-rows: var(--top-h) minmax(0,1fr);
  grid-template-areas: "top top top" "rail stage insp";
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r1)}
h1,h2,h3,p,ol,ul,dl,dd,figure{margin:0;padding:0}
ol,ul{list-style:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;z-index:50;background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:var(--r1)}
.skip:focus{top:8px}
kbd{font:600 11px/1 var(--mono);padding:3px 5px;border-radius:4px;border:1px solid currentColor;opacity:.75}
.mono{font-family:var(--mono);font-size:var(--t-xs)}

/* buttons */
.btn{min-height:44px;padding:0 var(--s4);border-radius:var(--r1);border:1px solid var(--line-strong);background:var(--surface);
  font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);white-space:nowrap;
  transition:background-color var(--dur-1) var(--ease-out),border-color var(--dur-1) var(--ease-out),transform var(--dur-1) var(--ease-out)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.danger.solid{background:var(--err);color:var(--surface)}
.btn[disabled]{cursor:not-allowed;opacity:.55}
.btn .ic{flex:none}
@media (hover:hover){
  .btn:not([disabled]):hover{background:var(--surface-2)}
  .btn.primary:not([disabled]):hover{background:var(--ink-2);border-color:var(--ink-2)}
  .btn.ghost:hover{background:var(--surface-2)}
}
.icon-btn{width:44px;height:44px;flex:none;display:inline-grid;place-items:center;border:0;background:transparent;border-radius:var(--r1);color:var(--ink);
  transition:background-color var(--dur-1) var(--ease-out)}
@media (hover:hover){.icon-btn:not([disabled]):hover{background:var(--surface-2)}}
.icon-btn[disabled]{opacity:.4;cursor:not-allowed}

/* ───────── Top bar ───────── */
.top{grid-area:top;display:flex;align-items:center;gap:var(--s4);padding:0 var(--s4);background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:var(--s2);flex:none}
.brand .glyph{color:var(--spike);display:grid}
.wordmark{font:650 var(--t-lg)/1 var(--font-display);letter-spacing:-.015em}
.mode{font-size:var(--t-xs);font-weight:600;color:var(--muted);border:1px solid var(--line-strong);border-radius:999px;padding:3px 8px}
.top-int{display:flex;align-items:baseline;gap:var(--s2);min-width:0;padding-left:var(--s4);border-left:1px solid var(--line)}
.top-int .lbl{font-size:var(--t-xs);color:var(--muted)}
.top-int strong{font-weight:600}
.top-rev{margin-left:auto;display:flex;align-items:center;gap:var(--s3);flex:none}
.rev{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-sm);color:var(--muted)}
.rev b{font:600 var(--t-xs) var(--mono);color:var(--ink)}
.rev.warn{color:var(--warn);background:var(--warn-soft);padding:4px 8px;border-radius:var(--r1);font-weight:600}
.m-only{display:none}

/* ───────── Rail (journeys) ───────── */
.panel{background:var(--surface);min-height:0;display:flex;flex-direction:column}
.rail{grid-area:rail;border-right:1px solid var(--line)}
.panel-head{display:flex;align-items:center;gap:var(--s2);padding:var(--s4) var(--s4) var(--s2);flex:none}
.panel-head h2{font:650 var(--t-md)/1.2 var(--font-display)}
.panel-head .sub{font-size:var(--t-xs);color:var(--muted)}
.panel-body{overflow-y:auto;overscroll-behavior:contain;min-height:0;flex:1}
.search{display:block;padding:0 var(--s4) var(--s3)}
.search input{width:100%;height:36px;border:1px solid var(--line-strong);border-radius:var(--r1);background:var(--bg);padding:0 var(--s3);font-size:var(--t-sm)}
.jgroup{padding:var(--s1) var(--s2) var(--s2)}
.j{width:100%;min-height:44px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:var(--s2);text-align:left;
  padding:var(--s2) var(--s2);border:0;background:transparent;border-radius:var(--r1)}
.j .j-g{display:block;font-size:var(--t-xs);color:var(--muted)}
.j .j-n{display:block;font-weight:600}
.j .j-c{font:600 var(--t-xs) var(--mono);color:var(--muted)}
@media (hover:hover){.j:hover,.st:hover{background:var(--surface-2)}}
.steps{position:relative;margin:2px 0 var(--s2) 14px;padding-left:var(--s2);border-left:1px solid var(--line)}
.st{width:100%;min-height:40px;display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:var(--s2);text-align:left;
  padding:var(--s1) var(--s2);border:0;background:transparent;border-radius:var(--r1);font-size:var(--t-md);color:var(--ink-2)}
.st .st-n{font:600 var(--t-xs) var(--mono);color:var(--muted);text-align:right}
.st .st-c{display:inline-flex;align-items:center;gap:3px;font:600 var(--t-xs) var(--mono);color:var(--spike)}
.st[aria-current="step"]{background:var(--surface-2);color:var(--ink);font-weight:600;box-shadow:inset 2px 0 0 var(--ink)}
.st[aria-current="step"] .st-n{color:var(--ink)}
.legacy{margin:var(--s2) var(--s4) var(--s5);border-top:1px solid var(--line);padding-top:var(--s3)}
.legacy summary{min-height:44px;display:flex;align-items:center;gap:var(--s2);cursor:pointer;font-weight:600;list-style:none}
.legacy summary::-webkit-details-marker{display:none}
.legacy summary .tag{margin-left:auto}
.legacy p{font-size:var(--t-sm);color:var(--muted);margin-bottom:var(--s2)}
.legacy li{display:flex;justify-content:space-between;gap:var(--s2);font-size:var(--t-sm);padding:6px 0;border-bottom:1px solid var(--line);color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:var(--t-xs);font-weight:600;padding:2px 6px;border-radius:4px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.err{background:var(--err-soft);color:var(--err)}

/* ───────── Stage ───────── */
.stage{grid-area:stage;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--stage);min-width:0;min-height:0;position:relative}
.ctxline{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s5);min-width:0}
.chips{display:flex;align-items:center;gap:var(--s1);min-width:0;flex-wrap:wrap}
.chip{min-height:36px;display:inline-flex;align-items:center;gap:6px;padding:0 var(--s3);border-radius:999px;border:1px solid var(--line-strong);
  background:var(--surface);font-size:var(--t-sm);white-space:nowrap;position:relative;
  transition:background-color var(--dur-1) var(--ease-out),border-color var(--dur-1) var(--ease-out)}
.chip::after{content:"";position:absolute;inset:-4px 0}  /* 44px hit area */
.chip .k{color:var(--muted)}
.chip .v{font-weight:600}
.chip.warn{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.chip.warn .k{color:inherit}
.chip[aria-expanded="true"]{border-color:var(--ink)}
@media (hover:hover){.chip:hover{border-color:var(--ink)}}
.ctxline .spacer{flex:1}
.mark-btn[aria-pressed="true"]{background:var(--spike);border-color:var(--spike);color:var(--spike-ink)}
.tablet-only{display:none}

.pv-wrap{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:var(--s2);padding:var(--s2) var(--s5) var(--s3);min-height:0;overflow:hidden}
.pv-frame{position:relative;flex:none}
.pv-clip{position:absolute;inset:0;border-radius:var(--r3);overflow:hidden;box-shadow:var(--shadow-preview);background:#fff}
.pv-scale{transform-origin:0 0}
.pv-cap{font-size:var(--t-xs);color:var(--muted);display:flex;gap:var(--s2);align-items:center;flex:none;min-height:18px}
body.marking .pv-cap{color:var(--spike);font-weight:600}
body.marking .pv-clip{box-shadow:0 0 0 2px var(--spike),var(--shadow-preview)}
body.marking #pv, body.marking #pv *{cursor:crosshair !important}

.stepbar{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s5) var(--s3);min-width:0}
.sb-t{min-width:0;display:grid}
.sb-t .a{font-size:var(--t-xs);color:var(--muted)}
.sb-t .b{font-weight:600}
.stepbar .tag{margin-left:auto}

/* spike mark — the signature */
.spike{position:absolute;left:0;top:0;pointer-events:none;z-index:4;
  transition:transform var(--dur-1) var(--ease-out),opacity var(--dur-1) var(--ease-out)}
.spike[hidden]{display:block;opacity:0}
.spike i{position:absolute;width:12px;height:12px;border:0 solid var(--spike)}
.spike i:nth-child(1){left:-3px;top:-3px;border-left-width:2.5px;border-top-width:2.5px}
.spike i:nth-child(2){right:-3px;top:-3px;border-right-width:2.5px;border-top-width:2.5px}
.spike i:nth-child(3){right:-3px;bottom:-3px;border-right-width:2.5px;border-bottom-width:2.5px}
.spike i:nth-child(4){left:-3px;bottom:-3px;border-left-width:2.5px;border-bottom-width:2.5px}
.spike .fill{position:absolute;inset:0;background:var(--spike);opacity:.07;border-radius:2px}
.spike .lab{position:absolute;left:-3px;bottom:calc(100% + 6px);background:var(--spike);color:var(--spike-ink);
  font:600 var(--t-xs)/1 var(--font);padding:5px 7px;border-radius:4px;white-space:nowrap}
.spike.sel .fill{opacity:0}
.spike.sel .lab{display:none}
.spike.flash{animation:flash 220ms var(--ease-out) 3}
@keyframes flash{50%{opacity:.25}}
.pins{position:absolute;inset:0;pointer-events:none;z-index:5}
.pin{position:absolute;left:0;top:0;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;border:2px solid var(--surface);
  background:var(--spike);color:var(--spike-ink);font:700 var(--t-xs)/1 var(--font);display:grid;place-items:center;pointer-events:auto;
  box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform var(--dur-1) var(--ease-out)}
.pin::before{content:"";position:absolute;inset:-12px}
.pin[aria-current="true"]{transform:scale(1.15);box-shadow:0 0 0 3px var(--spike-soft),0 1px 3px rgba(0,0,0,.25)}
.pin.new{background:var(--surface);color:var(--spike);border:2px dashed var(--spike)}

/* ───────── Inspector ───────── */
.insp{grid-area:insp;border-left:1px solid var(--line)}
.insp .panel-body{padding:0 var(--s4) var(--s6)}
.status-strip{display:flex;align-items:flex-start;gap:var(--s2);padding:var(--s3);border-radius:var(--r2);font-size:var(--t-sm);margin-bottom:var(--s3)}
.status-strip.warn{background:var(--warn-soft);color:var(--warn)}
.status-strip.err{background:var(--err-soft);color:var(--err)}
.status-strip .ic{flex:none;margin-top:1px}
.status-strip .t{display:grid;gap:2px}
.status-strip strong{display:block}
.status-strip .act{margin-top:var(--s2)}

.nlist{display:grid;gap:2px;margin-bottom:var(--s4)}
.nrow{width:100%;display:grid;grid-template-columns:24px minmax(0,1fr);gap:var(--s3);align-items:start;text-align:left;padding:var(--s3) var(--s2);
  border:0;background:transparent;border-radius:var(--r2);min-height:44px}
.nrow .pin-s{width:24px;height:24px;border-radius:50%;background:var(--spike);color:var(--spike-ink);font:700 var(--t-xs)/1 var(--font);display:grid;place-items:center}
.nrow .b{display:grid;gap:4px;min-width:0}
.nrow .t{font-size:var(--t-md);line-height:1.4}
.nrow .m{display:flex;align-items:center;gap:6px;font-size:var(--t-xs);color:var(--muted);flex-wrap:wrap}
.nrow[aria-current="true"]{background:var(--surface-2)}
@media (hover:hover){.nrow:hover{background:var(--surface-2)}}
.sect-h{font-size:var(--t-xs);font-weight:600;color:var(--muted);margin:var(--s4) 0 var(--s2);display:flex;justify-content:space-between}

.note{border-top:1px solid var(--line);padding-top:var(--s4);display:grid;gap:var(--s4)}
.note-h{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.note-h .id{font:600 var(--t-xs) var(--mono);color:var(--muted)}
.note-h .when{margin-left:auto;font-size:var(--t-xs);color:var(--muted)}
.note-text{font-size:var(--t-read);line-height:1.5;font-weight:500}
.evi{display:grid;gap:var(--s2)}
.shot{position:relative;width:100%;overflow:hidden;border-radius:var(--r2);border:1px solid var(--line);background:var(--surface-2)}
.shot .clone{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
.shot .spike{transition:none}
.evi figcaption{font-size:var(--t-xs);color:var(--muted);display:flex;gap:var(--s2);flex-wrap:wrap}
.meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px var(--s3);font-size:var(--t-sm)}
.meta dt{color:var(--muted)}
.meta dd{min-width:0;overflow-wrap:anywhere}
.repro{display:flex;align-items:center;gap:var(--s1);border:1px solid var(--line);border-radius:var(--r1);padding-left:var(--s3);background:var(--bg)}
.repro code{font:var(--t-xs)/1.4 var(--mono);color:var(--ink-2);min-width:0;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row-act{display:flex;gap:var(--s2);flex-wrap:wrap}
.lanes{display:grid;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.lane{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;gap:var(--s3);padding:var(--s3);min-height:56px}
.lane+.lane{border-top:1px solid var(--line)}
.lane .n{font-size:var(--t-sm);font-weight:600;display:block}
.lane .s{font-size:var(--t-xs);display:block;color:var(--muted)}
.lane.ok .ic,.lane.ok .s{color:var(--ok)}
.lane.warn{background:var(--warn-soft)}
.lane.warn .ic,.lane.warn .s{color:var(--warn)}
.lane.neutral .ic{color:var(--muted)}
.lane .btn{min-height:36px;padding:0 var(--s3);font-size:var(--t-sm);position:relative}
.lane .btn::after{content:"";position:absolute;inset:-4px 0}

.compose{display:grid;gap:var(--s3);padding:var(--s4);border:1px solid var(--spike);border-radius:var(--r2);background:var(--surface);margin-bottom:var(--s4)}
.compose-h{display:flex;align-items:center;gap:var(--s2)}
.compose-h h3{font-size:var(--t-md);font-weight:650}
.compose-h .btn{margin-left:auto}
.compose label{font-size:var(--t-sm);font-weight:600}
.compose textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line-strong);border-radius:var(--r1);padding:var(--s3);
  font-size:var(--t-read);line-height:1.5;background:var(--surface)}
.compose textarea[readonly]{background:var(--surface-2)}
.compose .act{display:flex;gap:var(--s2);justify-content:flex-end}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(1turn)}}

.empty{display:grid;justify-items:start;gap:var(--s3);padding:var(--s5) var(--s1)}
.empty .g{color:var(--spike)}
.empty h3{font:650 var(--t-lg)/1.3 var(--font-display)}
.empty p{color:var(--muted);font-size:var(--t-md);max-width:34ch}
.linkish{border:0;background:none;padding:0;color:var(--focus);font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:44px}

/* context popover / sheet */
.ctxpanel{position:absolute;top:56px;left:var(--s5);z-index:20;width:440px;max-width:calc(100% - 48px);border-radius:var(--r2);border:1px solid var(--line);
  box-shadow:var(--shadow-pop);padding:var(--s2) var(--s4) var(--s4);
  opacity:0;transform:translateY(-4px) scale(.98);transform-origin:top left;visibility:hidden;
  transition:opacity var(--dur-1) var(--ease-in),transform var(--dur-1) var(--ease-in),visibility 0s linear var(--dur-1)}
body[data-sheet="context"] .ctxpanel{opacity:1;transform:none;visibility:visible;
  transition:opacity var(--dur-2) var(--ease-out),transform var(--dur-2) var(--ease-out),visibility 0s}
.cg{border:0;margin:0;padding:var(--s3) 0 0;min-width:0}
.cg+.cg{border-top:1px solid var(--line);margin-top:var(--s3)}
.cg-h{font-size:var(--t-xs);font-weight:600;color:var(--muted);margin-bottom:var(--s2);display:block}
.cf{border:0;margin:0 0 var(--s2);padding:0;display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:var(--s2)}
.cf legend{float:left;font-size:var(--t-sm);font-weight:600;padding:0}
.seg{display:flex;flex-wrap:wrap;background:var(--surface-2);border-radius:var(--r1);padding:2px;gap:2px}
.seg label{position:relative;flex:1 1 auto}
.seg input{position:absolute;opacity:0;inset:0;margin:0}
.seg span{min-height:40px;display:grid;place-items:center;padding:0 var(--s2);border-radius:5px;font-size:var(--t-sm);white-space:nowrap;cursor:pointer;
  transition:background-color var(--dur-1) var(--ease-out)}
.seg input:checked+span{background:var(--surface);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg input:focus-visible+span{outline:2px solid var(--focus);outline-offset:1px}
.cg-note{font-size:var(--t-xs);color:var(--muted);margin-top:var(--s1)}

dialog{border:0;border-radius:var(--r3);padding:var(--s5);width:min(440px,calc(100vw - 32px));background:var(--surface);color:var(--ink);box-shadow:var(--shadow-pop)}
dialog::backdrop{background:rgba(10,12,14,.45)}
dialog[open]{animation:dlg var(--dur-2) var(--ease-out)}
@keyframes dlg{from{opacity:0;transform:scale(.97)}}
dialog h2{font:650 var(--t-lg)/1.3 var(--font-display);margin-bottom:var(--s2)}
dialog p{font-size:var(--t-md);color:var(--ink-2);margin-bottom:var(--s2)}
dialog .keep{font-size:var(--t-sm);color:var(--muted);display:flex;gap:6px;align-items:center}
dialog .act{display:flex;gap:var(--s2);justify-content:flex-end;margin-top:var(--s4);flex-wrap:wrap}

.mbar,.scrim,.grab{display:none}

/* ───────── Reviewed app: Laundry App styling lives ONLY here ───────── */
.lx{--lx-bg:#F2F7F6;--lx-surface:#FFFFFF;--lx-ink:#10302D;--lx-muted:#46605C;--lx-line:#D3E3E0;--lx-accent:#0B6E69;--lx-accent-ink:#FFFFFF;--lx-err:#B42318;--lx-warn-bg:#FFF4D6;
  font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif; font-size:16px; line-height:1.4;
  background:var(--lx-bg); color:var(--lx-ink); height:100%; display:flex; flex-direction:column; overflow:hidden}
.lx[data-scheme="dark"]{--lx-bg:#0C1716;--lx-surface:#142422;--lx-ink:#E3F1EF;--lx-muted:#9DB8B4;--lx-line:#25403C;--lx-accent:#4FC2BA;--lx-accent-ink:#04201E;--lx-err:#FF9C8F;--lx-warn-bg:#3A2E0B}
.lx[data-text="large"]{font-size:20px}
.lx *{box-sizing:border-box}
.lx button,.lx input{font:inherit;color:inherit}
.lx-head{display:flex;align-items:center;gap:.5em;padding:1em 1em .5em;flex:none}
.lx-back{width:2.75em;height:2.75em;border-radius:50%;border:0;background:var(--lx-surface);display:grid;place-items:center;color:var(--lx-ink)}
.lx-eyebrow{font-size:.8125em;color:var(--lx-muted);display:block}
.lx-title{font-size:1.5em;font-weight:700;letter-spacing:-.01em;display:block;line-height:1.15}
.lx-body{flex:1;min-height:0;overflow-y:auto;padding:.5em 1em 1em;display:grid;gap:.75em;align-content:start}
.lx-banner{margin:0 1em .5em;padding:.625em .75em;border-radius:12px;background:var(--lx-warn-bg);font-size:.875em;display:flex;gap:.5em;align-items:flex-start}
.lx-card{background:var(--lx-surface);border-radius:16px;padding:1em;display:grid;gap:.75em}
.lx-card h3{font-size:1em;font-weight:700;margin:0}
.lx-fiber{display:flex;align-items:center;gap:.75em;min-height:2.75em}
.lx-fiber .nm{flex:1;min-width:0;font-weight:600}
.lx-stepper{display:flex;align-items:center;gap:.25em;flex:none}
.lx-stepper button{width:2.75em;height:2.75em;border-radius:50%;border:1px solid var(--lx-line);background:transparent;font-size:1.125em;line-height:1}
.lx-stepper button:disabled{opacity:.4}
.lx-num{display:flex;align-items:baseline;gap:2px;white-space:nowrap}
.lx-num input{width:2.6em;text-align:right;border:0;border-bottom:1.5px solid var(--lx-line);background:transparent;font-weight:700;font-size:1.0625em;padding:.25em 0;-moz-appearance:textfield}
.lx-num input::-webkit-inner-spin-button{-webkit-appearance:none}
.lx-add{min-height:2.75em;border-radius:12px;border:1.5px dashed var(--lx-line);background:transparent;font-weight:600;color:var(--lx-accent)}
.lx-row{display:flex;justify-content:space-between;gap:1em;min-height:2.75em;align-items:center;border-top:1px solid var(--lx-line)}
.lx-row:first-of-type{border-top:0}
.lx-row .v{font-weight:600;text-align:right}
.lx-opt{display:flex;align-items:center;justify-content:space-between;min-height:3em;padding:0 .25em;border-top:1px solid var(--lx-line);font-weight:600;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.lx-opt:first-of-type{border-top:0}
.lx-opt .ck{color:var(--lx-accent)}
.lx-photo{aspect-ratio:3/4;border-radius:16px;border:1.5px dashed var(--lx-line);display:grid;place-items:center;text-align:center;color:var(--lx-muted);font-size:.875em;padding:1em;background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(127,160,155,.08) 10px 20px)}
.lx-foot{flex:none;padding:.75em 1em 1.25em;background:var(--lx-surface);border-top:1px solid var(--lx-line);display:grid;gap:.5em}
.lx-total{display:flex;align-items:center;justify-content:space-between;gap:.5em;font-weight:600}
.lx-total .val{font-size:1.25em;font-weight:800;white-space:nowrap}
.lx-total.bad{color:var(--lx-err)}
.lx-primary{min-height:3em;border-radius:14px;border:0;background:var(--lx-accent);color:var(--lx-accent-ink);font-weight:700;width:100%}
.lx-primary:disabled{opacity:.45}
.lx-msg{font-size:.8125em;color:var(--lx-muted);min-height:1.2em;text-align:center}
.lx-msg.err{color:var(--lx-err);font-weight:600}
.lx :focus-visible{outline:2px solid var(--lx-accent);outline-offset:2px}

/* ───────── Tablet 768–1023: journeys become a drawer ───────── */
@media (max-width:1023px){
  body{grid-template-columns:minmax(0,1fr) 320px;grid-template-areas:"top top" "stage insp"}
  .tablet-only{display:inline-flex}
  .rail{position:fixed;left:0;top:0;bottom:0;width:300px;z-index:30;box-shadow:var(--shadow-pop);
    transform:translateX(-100%);visibility:hidden;
    transition:transform var(--dur-3) var(--ease-in),visibility 0s linear var(--dur-3)}
  body[data-sheet="journeys"] .rail{transform:none;visibility:visible;transition:transform var(--dur-3) var(--ease-out),visibility 0s}
  .scrim{display:block;position:fixed;inset:0;background:rgba(10,12,14,.4);z-index:25;opacity:0;visibility:hidden;
    transition:opacity var(--dur-2) var(--ease-in),visibility 0s linear var(--dur-2)}
  body[data-sheet="journeys"] .scrim{opacity:1;visibility:visible;transition:opacity var(--dur-2) var(--ease-out),visibility 0s}
  .top-int{display:none}
  .rail .m-close{display:inline-grid}
}

/* ───────── Mobile < 768: preview first, everything else is a sheet ───────── */
@media (max-width:767px){
  body{grid-template-columns:minmax(0,1fr);grid-template-rows:var(--top-h) minmax(0,1fr) auto;grid-template-areas:"top" "stage" "mbar"}
  .top{padding:0 var(--s1) 0 var(--s3);gap:var(--s1);padding-top:env(safe-area-inset-top)}
  .wordmark,.mode,.top-rev,.top-int{display:none}
  .m-only{display:inline-flex}
  .m-step{flex:1;min-width:0;min-height:44px;border:0;background:transparent;text-align:left;display:grid;padding:0 var(--s2);border-radius:var(--r1)}
  .m-step .a{font-size:var(--t-xs);color:var(--muted);display:block}
  .m-step .b{font-weight:650;display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .ctxline,.stepbar,.tablet-only{display:none}
  .stage{grid-template-rows:minmax(0,1fr)}
  .pv-wrap{padding:var(--s2) var(--s2) var(--s1)}
  .mbar{grid-area:mbar;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:var(--s1) var(--s2) calc(var(--s1) + env(safe-area-inset-bottom))}
  .mb{min-height:56px;border:0;background:transparent;border-radius:var(--r2);display:grid;justify-items:center;align-content:center;gap:2px;font-size:var(--t-xs);font-weight:600;color:var(--muted);position:relative}
  .mb[aria-pressed="true"],.mb[aria-expanded="true"]{color:var(--ink)}
  .mb.mark[aria-pressed="true"]{color:var(--spike-ink);background:var(--spike)}
  .mb .badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--spike);color:var(--spike-ink);font:700 11px/18px var(--font)}

  .rail,.insp,.ctxpanel{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;max-width:none;max-height:min(86dvh,760px);z-index:30;
    border:0;border-radius:16px 16px 0 0;box-shadow:var(--shadow-pop);padding:0;
    opacity:1;transform:translateY(100%);visibility:hidden;
    transition:transform var(--dur-3) var(--ease-in),visibility 0s linear var(--dur-3)}
  .ctxpanel{padding:0 var(--s4) calc(var(--s4) + env(safe-area-inset-bottom));overflow-y:auto}
  body[data-sheet="journeys"] .rail, body[data-sheet="notes"] .insp, body[data-sheet="context"] .ctxpanel{
    transform:none;visibility:visible;transition:transform var(--dur-3) var(--ease-out),visibility 0s}
  .grab{display:block;width:36px;height:5px;border-radius:3px;background:var(--line-strong);margin:8px auto 0;flex:none}
  .scrim{display:block;position:fixed;inset:0;background:rgba(10,12,14,.4);z-index:25;opacity:0;visibility:hidden;
    transition:opacity var(--dur-2) var(--ease-in),visibility 0s linear var(--dur-2)}
  body[data-sheet]:not([data-sheet=""]) .scrim{opacity:1;visibility:visible;transition:opacity var(--dur-2) var(--ease-out),visibility 0s}
  .cf{grid-template-columns:minmax(0,1fr)}
  .panel-head .m-close{margin-left:auto}
}
.m-close{display:none}
@media (max-width:767px){ .m-close{display:inline-grid} }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:0.01ms !important;animation-duration:0.01ms !important;animation-iteration-count:1 !important}
  .spin{animation:none;border-right-color:currentColor;opacity:.6}
}

<body>
<a class="skip" href="#pv">Skip to preview</a>

<header class="top" id="top">
  <div class="brand"><span class="glyph" id="brandGlyph"></span><span class="wordmark">Rehearsal</span><span class="mode">Operate</span></div>
  <div class="top-int"><span class="lbl">Reviewing</span><strong>Laundry App</strong><span class="tag">First integration</span></div>
  <button class="m-step m-only" id="mStep" aria-haspopup="dialog"></button>
  <button class="icon-btn m-only" id="mPrev" aria-label="Previous step"></button>
  <button class="icon-btn m-only" id="mNext" aria-label="Next step"></button>
  <div class="top-rev" id="topRev"></div>
</header>

<nav class="panel rail" id="rail" aria-label="Journeys and steps"></nav>

<main class="stage" id="stage">
  <div class="ctxline">
    <button class="btn tablet-only" id="railBtn" aria-expanded="false" aria-controls="rail"></button>
    <div class="chips" id="chips" role="group" aria-label="Preview context"></div>
    <span class="spacer"></span>
    <button class="btn mark-btn" id="markBtn" aria-pressed="false"></button>
  </div>
  <div class="pv-wrap" id="pvWrap">
    <div class="pv-frame" id="pvFrame">
      <div class="pv-clip"><div class="pv-scale" id="pvScale"><div class="lx" id="pv" role="region" aria-label="Reviewed app preview — Laundry App" tabindex="-1"></div></div></div>
      <div class="spike sel" id="selMark" hidden aria-hidden="true"><i></i><i></i><i></i><i></i><span class="fill"></span></div>
      <div class="spike" id="spike" hidden aria-hidden="true"><i></i><i></i><i></i><i></i><span class="fill"></span><span class="lab" id="spikeLab"></span></div>
      <div class="pins" id="pins"></div>
    </div>
    <p class="pv-cap" id="pvCap" aria-live="polite"></p>
  </div>
  <div class="stepbar" id="stepbar"></div>
  <section class="panel ctxpanel" id="ctxPanel" role="dialog" aria-modal="false" aria-labelledby="ctxT"></section>
</main>

<aside class="panel insp" id="insp" aria-label="Notes and evidence"></aside>

<nav class="mbar" id="mbar" aria-label="Review tools"></nav>

<dialog id="confirm" aria-labelledby="cfT" aria-describedby="cfD">
  <h2 id="cfT">Discard unsaved note?</h2>
  <p id="cfD"></p>
  <p class="keep" id="cfKeepNote"></p>
  <div class="act">
    <button class="btn" id="cfKeep" autofocus>Keep editing</button>
    <button class="btn danger solid" id="cfDiscard">Discard and switch</button>
  </div>
</dialog>
<div class="sr" id="live" aria-live="polite"></div>

<script>
/* ───────── icons: one 1.5px outline family ───────── */
const ic=(p,s=20)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I={
  spike:s=>ic('<path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/>',s),
  list:s=>ic('<path d="M7.5 5H17M7.5 10H17M7.5 15H17"/><path d="M3.5 5h.5M3.5 10h.5M3.5 15h.5" stroke-width="2"/>',s),
  sliders:s=>ic('<path d="M3 6h9M16 6h1M3 14h2M9 14h8"/><circle cx="14" cy="6" r="2"/><circle cx="7" cy="14" r="2"/>',s),
  note:s=>ic('<path d="M4 3.5h12v9L12 16.5H4z"/><path d="M12 16.5v-4h4"/>',s),
  left:s=>ic('<path d="M12.5 4l-6 6 6 6"/>',s), right:s=>ic('<path d="M7.5 4l6 6-6 6"/>',s),
  check:s=>ic('<path d="M4 10.5l4 4 8-9"/>',s),
  warn:s=>ic('<path d="M10 3l7.5 13.5h-15z"/><path d="M10 8v3.5"/><path d="M10 14h.01" stroke-width="2"/>',s),
  clock:s=>ic('<circle cx="10" cy="10" r="7"/><path d="M10 6.5V10l2.5 1.5"/>',s),
  dash:s=>ic('<circle cx="10" cy="10" r="7"/><path d="M7 10h6"/>',s),
  dot:s=>ic('<circle cx="10" cy="10" r="7"/>',s),
  copy:s=>ic('<rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M13 7V4.5A1.5 1.5 0 0 0 11.5 3h-7A1.5 1.5 0 0 0 3 4.5v7A1.5 1.5 0 0 0 4.5 13H7"/>',s),
  replay:s=>ic('<path d="M4 10a6 6 0 1 0 6-6H7.5"/><path d="M9.5 1.5L7 4l2.5 2.5"/>',s),
  x:s=>ic('<path d="M5 5l10 10M15 5L5 15"/>',s),
  err:s=>ic('<circle cx="10" cy="10" r="7"/><path d="M10 6.5v4"/><path d="M10 13.5h.01" stroke-width="2"/>',s),
};

/* ───────── synthetic data (no real users or records) ───────── */
const J=[
  {id:'towel',name:'Towel intake',group:'Multicolor pack',sc:9,steps:['Choose item','Label photo','Fabric composition','Care tags','Review & save']},
  {id:'records',name:'Saved records',group:'Records & editors',sc:8,steps:['Record list','Open record','Edit fields','Save changes']},
  {id:'tags',name:'Nested tags & care',group:'Tags & care',sc:7,steps:['Tag tree','Add child tag','Care symbols']},
  {id:'appliance',name:'Appliance intake',group:'Appliances & products',sc:6,steps:['Scan product','Confirm model','Edit programs']},
  {id:'profile',name:'Profile & water',group:'Household',sc:4,steps:['Household','Water hardness']},
];
const ROWS={records:['Bath towel · Multicolor pack','Duvet cover · Washed linen','Merino jumper · Grey'],
  tags:['Bathroom › Towels','Bathroom › Bath mats','Bedroom › Linen'],
  appliance:['Front-loader · 8 kg','Heat-pump dryer · 9 kg'],
  profile:['3 people · 2 bathrooms','Water hardness · Medium, 12 °dH']};
const LEGACY=['Stain guide · v1 list','Closet grid · 2019 card','Onboarding carousel','Detergent picker','Wash timer · legacy'];
const CTX={
  persona:{label:'Persona',opts:[['single','Single'],['student','Student'],['parent','Parent']]},
  role:{label:'Permission',opts:[['owner','Owner'],['member','Member']]},
  cond:{label:'Condition',opts:[['normal','Normal'],['savefail','Save failure'],['offline','Offline'],['nocare','Missing care']]},
  size:{label:'Size',opts:[['320','320'],['393','393'],['1024','1024']]},
  scheme:{label:'Appearance',opts:[['light','Light'],['dark','Dark']]},
  text:{label:'Text',opts:[['standard','Standard'],['large','Enlarged']]},
};
const EL={total:'Composition total','fiber-cotton':'Cotton row','fiber-poly':'Polyester row',add:'Add fiber',care:'Care section',
  composition:'Composition card',save:'Save fabric',back:'Back button',offline:'Offline banner',photo:'Label photo',opts:'Item options',summary:'Summary card',list:'Record list',next:'Continue button'};
const BUILD='a41c9e2', DESIGN='r14';
const LANES=[['preview','Working preview'],['design','Design revision'],['browser','Browser verification'],['device','Physical-device acceptance']];
const LST={
  open:{t:'Open — not yet fixed',i:'dot',c:'neutral'},
  fixed:{t:`Fixed in build ${BUILD}`,i:'check',c:'ok'},
  stale:{t:`Stale — captured on r12, design is now ${DESIGN}`,i:'warn',c:'warn'},
  current:{t:`Matches design ${DESIGN}`,i:'check',c:'ok'},
  pending:{t:'Awaiting check',i:'clock',c:'neutral'},
  passed:{t:'Passed · Chrome, 393 pt',i:'check',c:'ok'},
  none:{t:'Not started',i:'dash',c:'neutral'},
  accepted:{t:'Accepted on a physical phone',i:'check',c:'ok'},
};

const S={
  j:'towel',step:3,q:'',
  ctx:{persona:'student',role:'owner',cond:'normal',size:'393',scheme:'light',text:'standard'},
  fabric:[{id:'cotton',name:'Cotton',pct:80},{id:'poly',name:'Polyester',pct:20}],
  appMsg:null,mark:false,draft:null,saving:false,saveErr:false,failNext:false,freeze:false,
  sel:'RH-0142',sheet:'',scale:1,flash:null,seq:143,pendingFn:null,
  notes:[
    {id:'RH-0142',j:'towel',step:3,el:'total',comment:'Keep the composition total visible while editing.',
      state:'Cotton 80% · Polyester 20% · Total 100%',ctx:{persona:'student',role:'owner',cond:'normal',size:'393',scheme:'light',text:'standard'},
      build:'9f02b7d',design:'r12',when:'Oct 8, 16:42',lanes:{preview:'fixed',design:'stale',browser:'pending',device:'none'}},
    {id:'RH-0139',j:'towel',step:3,el:'care',comment:'With missing care, say how to add a label from the photo instead of only “Missing”.',
      state:'Care label missing',ctx:{persona:'parent',role:'owner',cond:'nocare',size:'393',scheme:'light',text:'standard'},
      build:BUILD,design:'r14',when:'Oct 9, 09:15',lanes:{preview:'open',design:'current',browser:'none',device:'none'}},
  ],
};

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jr=()=>J.find(x=>x.id===S.j);

/* ───────── guarded context changes: drafts are never silently lost ───────── */
function guarded(desc,fn){
  if(S.draft){
    S.pendingFn=fn;
    $('#cfT').textContent='Discard unsaved note?';
    $('#cfD').textContent=`${desc} reloads the preview. Your pin on “${EL[S.draft.el]||S.draft.el}” and its note text will be lost.`;
    $('#cfKeepNote').innerHTML=`${I.check(16)} Saved notes and synthetic records are not affected.`;
    $('#cfDiscard').textContent=fn?'Discard and switch':'Discard note';
    $('#confirm').showModal();
  } else { fn&&fn(); render(); }
}
$('#cfKeep').onclick=()=>{$('#confirm').close();render()};
$('#cfDiscard').onclick=()=>{$('#confirm').close();S.draft=null;S.saveErr=false;S.saving=false;const f=S.pendingFn;S.pendingFn=null;f&&f();render();say('Draft note discarded.')};
$('#confirm').addEventListener('cancel',()=>setTimeout(render));

function setStep(j,step){S.j=j;S.step=step;S.appMsg=null;const ns=stepNotes();if(!ns.find(n=>n.id===S.sel))S.sel=ns[0]?ns[0].id:null}
function goStep(j,step){
  if(j===S.j&&step===S.step) return;
  const jj=J.find(x=>x.id===j);
  guarded(`Moving to “${jj.steps[step-1]}”`,()=>{setStep(j,step);if(narrow())S.sheet=''});
}

/* ───────── preview geometry: scale-to-fit, pins, spike ───────── */
function layout(){
  const wrap=$('#pvWrap'),cap=$('#pvCap'),cs=getComputedStyle(wrap);
  const aw=wrap.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const ah=wrap.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-26;
  const size=+S.ctx.size,k=Math.min(1,aw/size);
  const ih=Math.max(420,Math.floor(ah/k));
  S.scale=k;
  Object.assign($('#pvScale').style,{width:size+'px',height:ih+'px',transform:`scale(${k})`});
  Object.assign($('#pvFrame').style,{width:size*k+'px',height:ih*k+'px'});
  cap.textContent=S.mark?'Marking — choose an element, or Tab to it and press Enter. Esc stops.'
    :`${size} pt · ${k<1?Math.round(k*100)+'% to fit':'actual size'} · ${optLabel('scheme',S.ctx.scheme)}${S.ctx.text==='large'?' · enlarged text':''} · working preview`;
  placePins();fillShots();
}
function rel(el){const r=el.getBoundingClientRect(),f=$('#pvFrame').getBoundingClientRect();return{x:r.left-f.left,y:r.top-f.top,w:r.width,h:r.height}}
function boxTo(node,r,pad=4){node.style.transform=`translate(${r.x-pad}px,${r.y-pad}px)`;node.style.width=r.w+pad*2+'px';node.style.height=r.h+pad*2+'px'}
function placePins(){
  const pins=$('#pins'),pv=$('#pv');let h='';
  const ns=stepNotes(),F=$('#pvFrame');
  const pos=(key)=>{const el=pv.querySelector(`[data-el="${key}"]`);if(!el)return null;const r=rel(el);
    return{x:Math.min(F.offsetWidth-6,Math.max(6,r.x+r.w-4)),y:Math.min(F.offsetHeight-6,Math.max(6,r.y+4))}};
  ns.forEach((n,i)=>{const p=pos(n.el);if(!p)return;
    h+=`<button class="pin" style="transform:translate(${p.x}px,${p.y}px)" data-note="${n.id}" ${S.sel===n.id&&!S.draft?'aria-current="true"':''} aria-label="Note ${i+1}: ${esc(n.comment)}">${i+1}</button>`});
  if(S.draft){const p=pos(S.draft.el);if(p)h+=`<button class="pin new" style="transform:translate(${p.x}px,${p.y}px)" data-draftpin aria-label="Unsaved note pin">+</button>`}
  pins.innerHTML=h;
  const selKey=S.draft?S.draft.el:(ns.find(n=>n.id===S.sel)||{}).el;
  const sm=$('#selMark'),t=selKey&&!S.mark&&pv.querySelector(`[data-el="${selKey}"]`);
  if(t){boxTo(sm,rel(t));sm.hidden=false;sm.classList.toggle('flash',S.flash===selKey);S.flash=null}else sm.hidden=true;
}
function fillShots(){
  const pv=$('#pv'),k=S.scale;
  document.querySelectorAll('[data-shot]').forEach(box=>{
    const t=pv.querySelector(`[data-el="${box.dataset.shot}"]`);
    if(!t){box.style.height='auto';box.innerHTML=`<p style="padding:12px;font-size:12px;color:var(--muted)">Element not on this screen in the current context. Reproduce to restore it.</p>`;return}
    const pr=pv.getBoundingClientRect(),tr=t.getBoundingClientRect(),pad=20;
    const x=(tr.left-pr.left)/k-pad,y=(tr.top-pr.top)/k-pad,w=tr.width/k+pad*2,hh=tr.height/k+pad*2;
    const bw=box.clientWidth||300,z=Math.min(bw/w,1.4);
    box.style.height=Math.round(hh*z)+'px';
    const c=pv.cloneNode(true);c.removeAttribute('id');c.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));c.inert=true;
    c.classList.add('clone');c.removeAttribute('role');c.removeAttribute('aria-label');
    Object.assign(c.style,{width:pv.offsetWidth+'px',height:pv.offsetHeight+'px',transform:`scale(${z}) translate(${-x}px,${-y}px)`});
    box.innerHTML='';box.appendChild(c);
    const m=document.createElement('div');m.className='spike sel';m.innerHTML='<i></i><i></i><i></i><i></i>';
    Object.assign(m.style,{transform:`translate(${(pad-4)*z}px,${(pad-4)*z}px)`,width:(tr.width/k+8)*z+'px',height:(tr.height/k+8)*z+'px'});
    box.appendChild(m);
  });
}
function showSpike(t){
  const sp=$('#spike');
  if(!t){sp.hidden=true;return}
  boxTo(sp,rel(t));$('#spikeLab').textContent=EL[t.dataset.el]||t.dataset.el;sp.hidden=false;
}

/* ───────── marking: the signature interaction ───────── */
function setMark(on){
  S.mark=on;if(!on)showSpike(null);
  if(on&&narrow())S.sheet='';
  render();
  if(on){$('#pv').focus({preventScroll:true});say('Marking on. Choose an element in the preview.')}
}
function captureState(){
  const j=jr();
  if(j.id==='towel'&&S.step===3) return `${S.fabric.map(f=>`${f.name} ${f.pct}%`).join(' · ')} · Total ${total()}%`;
  return `${j.steps[S.step-1]} · record TW-0081`;
}
function pin(t){
  const key=t.dataset.el;
  if(S.draft){S.draft.el=key;}
  else S.draft={el:key,j:S.j,step:S.step,ctx:{...S.ctx},comment:'',state:captureState()};
  S.saveErr=false;S.mark=false;showSpike(null);
  if(narrow())S.sheet='notes';
  render();
  const ta=$('#cmpText');ta&&ta.focus();
  say(`Pinned to ${EL[key]||key}. Write the note.`);
}
const F=$('#pvFrame');
F.addEventListener('pointermove',e=>{if(!S.mark)return;showSpike(e.target.closest('#pv [data-el]'))});
F.addEventListener('pointerleave',()=>S.mark&&showSpike(null));
F.addEventListener('click',e=>{
  if(!S.mark)return;
  const t=e.target.closest('#pv [data-el]');e.preventDefault();e.stopPropagation();
  if(t)pin(t);
},true);
$('#pv').addEventListener('focusin',e=>{if(S.mark)showSpike(e.target.closest('[data-el]'))});
$('#pv').addEventListener('keydown',e=>{
  if(S.mark&&e.key==='Enter'){const t=e.target.closest('[data-el]');if(t){e.preventDefault();pin(t)}}
},true);
$('#pv').addEventListener('scroll',()=>{placePins()},true);

/* ───────── reviewed-app behavior (synthetic) ───────── */
$('#pv').addEventListener('click',e=>{
  if(S.mark)return;
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,j=jr();
  if(a==='inc'||a==='dec'){const f=S.fabric.find(x=>x.id===b.dataset.id);f.pct=Math.max(0,Math.min(100,f.pct+(a==='inc'?5:-5)));S.appMsg=null;render()}
  if(a==='add'){const names=['Linen','Bamboo viscose','Elastane'];const n=names[S.fabric.length-2];if(n){S.fabric.push({id:'f'+S.fabric.length,name:n,pct:0});render()}}
  if(a==='save'){
    S.appMsg=S.ctx.cond==='savefail'?{t:'Couldn’t save. Check your connection and try again.',err:true}:S.ctx.cond==='offline'?{t:'Saved on this phone. Syncs when you’re online.'}:{t:'Saved.'};render()}
  if(a==='next'&&S.step<j.steps.length)goStep(S.j,S.step+1);
  if(a==='back'&&S.step>1)goStep(S.j,S.step-1);
});
$('#pv').addEventListener('change',e=>{
  const id=e.target.dataset.fiber;if(!id)return;
  const f=S.fabric.find(x=>x.id===id);const v=parseInt(e.target.value,10);
  f.pct=isNaN(v)?0:Math.max(0,Math.min(100,v));S.appMsg=null;render();
});

/* ───────── workbench events ───────── */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-close]');if(!t)return;
  if(t.closest('#pv'))return;
  if(t.hasAttribute('data-close')){S.sheet='';render();return}
  if(t.dataset.chip){S.sheet=S.sheet==='context'?'':'context';render();
    if(S.sheet){const g=$(`#ctxPanel input[name="ctx-${t.dataset.chip}"]:checked`);g&&g.focus()}return}
  if(t.dataset.sheet){const s=t.dataset.sheet;S.sheet=S.sheet===s?'':s;render();return}
  if(t.id==='railBtn'){S.sheet=S.sheet==='journeys'?'':'journeys';render();$('#railQ')&&S.sheet&&$('#railQ').focus();return}
  if(t.id==='mStep'){S.sheet='journeys';render();return}
  if(t.id==='mPrev'||t.id==='sbPrev'){if(S.step>1)goStep(S.j,S.step-1);return}
  if(t.id==='mNext'||t.id==='sbNext'){if(S.step<jr().steps.length)goStep(S.j,S.step+1);return}
  if(t.id==='markBtn'||t.id==='mbM'||t.id==='emptyMark'||t.id==='cmpRepin'){setMark(!S.mark||t.id==='cmpRepin');return}
  if(t.dataset.step){goStep(t.dataset.j,+t.dataset.step);return}
  if(t.dataset.j&&t.classList.contains('j')){const j=J.find(x=>x.id===t.dataset.j);if(j.id!==S.j)goStep(j.id,1);return}
  if(t.dataset.lane){const n=S.notes.find(x=>x.id===t.dataset.note);
    n.lanes[t.dataset.lane]={design:'current',browser:'passed',device:'accepted'}[t.dataset.lane];
    if(t.dataset.lane==='design')n.design=DESIGN;render();say('Lane updated.');return}
  if(t.dataset.copy){const n=S.notes.find(x=>x.id===t.dataset.copy);
    (navigator.clipboard?navigator.clipboard.writeText(reproLink(n)):Promise.reject()).then(()=>say('Reproduction link copied.'),()=>say('Copy unavailable — select the link text instead.'));return}
  if(t.dataset.repro){const n=S.notes.find(x=>x.id===t.dataset.repro);
    guarded('Reproducing '+n.id,()=>{S.ctx={...n.ctx};setStep(n.j,n.step);S.sel=n.id;S.flash=n.el;if(narrow())S.sheet=''});
    say(`Reproduced ${n.id}: ${ctxSummary(n.ctx)}.`);return}
  if(t.dataset.note&&!S.draft){S.sel=t.dataset.note;if(narrow()&&t.classList.contains('pin'))S.sheet='notes';render();return}
  if(t.dataset.note&&S.draft&&t.classList.contains('pin')){if(narrow())S.sheet='notes';render();return}
  if(t.hasAttribute('data-draftpin')){if(narrow())S.sheet='notes';render();$('#cmpText')&&$('#cmpText').focus();return}
  if(t.id==='cmpCancel'){guarded('Discarding',null);return}
  if(t.id==='cmpSave'){saveDraft();return}
});
$('#scrim').addEventListener('click',()=>{S.sheet='';render()});
document.addEventListener('input',e=>{
  if(e.target.id==='cmpText'&&S.draft)S.draft.comment=e.target.value;
  if(e.target.id==='railQ'){S.q=e.target.value;renderRail();$('#railQ').focus()}
});
document.addEventListener('change',e=>{
  const m=e.target.name&&e.target.name.match(/^ctx-(\w+)$/);if(!m)return;
  const k=m[1],v=e.target.value;
  guarded(`Changing ${CTX[k].label.toLowerCase()} to ${optLabel(k,v)}`,()=>{S.ctx[k]=v;S.appMsg=null});
});
document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if(e.key==='Escape'){if(S.mark){setMark(false);return}if(S.sheet){S.sheet='';render();return}}
  if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='p'||e.key==='P'){e.preventDefault();setMark(!S.mark)}
  if(e.key==='['&&S.step>1)goStep(S.j,S.step-1);
  if(e.key===']'&&S.step<jr().steps.length)goStep(S.j,S.step+1);
});
function saveDraft(){
  if(!S.draft)return;
  if(!S.draft.comment.trim()){const ta=$('#cmpText');ta.setAttribute('aria-invalid','true');ta.focus();say('Write the note before saving.');return}
  S.saving=true;S.saveErr=false;render();
  if(S.freeze)return;
  setTimeout(()=>{
    S.saving=false;
    if(S.failNext){S.failNext=false;S.saveErr=true;render();say('Note not saved. Your note is kept. Retry when ready.');return}
    const d=S.draft,id='RH-0'+(S.seq++);
    S.notes.push({id,j:d.j,step:d.step,el:d.el,comment:d.comment.trim(),state:d.state,ctx:d.ctx,build:BUILD,design:DESIGN,when:'Oct 9, now',
      lanes:{preview:'open',design:'current',browser:'none',device:'none'}});
    S.draft=null;S.sel=id;render();say(`Note ${id} saved.`);
  },900);
}
addEventListener('resize',()=>layout());

/* ───────── board states via URL (?state=, ?sheet=, ?theme=) ───────── */
const qs=new URLSearchParams(location.search),st=qs.get('state')||'saved';
if(qs.get('theme'))document.documentElement.dataset.theme=qs.get('theme');
if(st==='empty')setStep('towel',4);
if(['compose','error','pending','confirm'].includes(st)){
  S.draft={el:'add',j:'towel',step:3,ctx:{...S.ctx},state:captureState(),
    comment:'Before adding a fiber, show how much of the 100% is left — 0% remaining is easy to miss.'};
}
if(st==='error')S.saveErr=true;
if(st==='pending'){S.saving=true;S.freeze=true}
if(st==='retry')S.failNext=true;
if(qs.get('sheet'))S.sheet=qs.get('sheet');
if(qs.get('mark'))S.mark=true;
render();
addEventListener('load',()=>{
  layout();
  if(st==='confirm')guarded('Changing persona to Parent',()=>{S.ctx.persona='parent'});
  if(qs.get('mark')){const t=$('#pv [data-el="fiber-cotton"]');t&&showSpike(t)}
});
</script>
